<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Mobile · Admin · Barra do topo</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div style="width: 390px; font-family: Outfit, system-ui, sans-serif; color: #18181B; background: #F4F3EF; position: relative">
<header style="height: 60px; padding: 0 8px; display: flex; align-items: center; gap: 6px; border-bottom: 1px solid #E6E4DE; background: #F4F3EF">
<button onClick="{{openMenu}}" aria-label="Abrir menu do painel" aria-expanded="{{menu}}" style="width: 44px; height: 44px; border-radius: 12px; border: none; background: transparent; color: #18181B; display: flex; align-items: center; justify-content: center; cursor: pointer; position: relative"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h10"></path></svg><span style="position: absolute; top: 9px; right: 8px; width: 8px; height: 8px; border-radius: 50%; background: #E8793A"></span></button>
<span style="flex-grow: 1; display: flex; flex-direction: column; line-height: 1.15"><span style="font-family: 'JetBrains Mono', monospace; font-size: 9px; letter-spacing: 0.16em; color: #6B6B72">MARFIM · ADMIN</span><span style="font-size: 18px; font-weight: 500; letter-spacing: -0.01em">{{title}}</span></span>
<a href="MobileAdminPedidos.dc.html" aria-label="Pedidos a preparar" style="position: relative; width: 44px; height: 44px; border-radius: 12px; display: flex; align-items: center; justify-content: center; color: #18181B"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9M10 21h4"></path></svg><span style="position: absolute; top: 5px; right: 3px; min-width: 18px; height: 18px; padding: 0 5px; box-sizing: border-box; border-radius: 999px; background: #3B3FD9; color: #FFFFFF; font-family: 'JetBrains Mono', monospace; font-size: 10px; display: flex; align-items: center; justify-content: center">8</span></a>
<span style="width: 34px; height: 34px; border-radius: 50%; background: #E3E1F9; color: #3B3FD9; font-size: 11px; font-weight: 500; display: flex; align-items: center; justify-content: center; margin-right: 4px">AD</span>
</header>
<sc-if value="{{menu}}" hint-placeholder-val="{{ false }}">
<div onClick="{{closeMenu}}" style="position: fixed; inset: 0; background: rgba(24,24,27,.35); z-index: 50"></div>
<nav aria-label="Administração" style="position: fixed; top: 0; left: 0; bottom: 0; width: 300px; background: #F4F3EF; z-index: 51; padding: 18px 14px; box-sizing: border-box; display: flex; flex-direction: column; gap: 18px; overflow: auto; box-shadow: 20px 0 40px -20px rgba(24,24,27,.3)">
<div style="display: flex; align-items: center; gap: 8px; padding: 0 6px">
<span style="width: 28px; height: 28px; border-radius: 8px; background: #3B3FD9; display: flex; align-items: center; justify-content: center"><svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round"><circle cx="8" cy="8" r="5"></circle><path d="M8 3v10"></path></svg></span>
<span style="font-size: 20px; font-weight: 500; letter-spacing: -0.02em; flex-grow: 1">marfim<span style="color: #3B3FD9">.</span></span>
<button onClick="{{closeMenu}}" aria-label="Fechar menu" style="width: 44px; height: 44px; border-radius: 12px; border: none; background: transparent; font-size: 22px; color: #44444A; cursor: pointer">×</button>
</div>
<sc-for list="{{groups}}" as="g" hint-placeholder-count="3">
<div style="display: flex; flex-direction: column; gap: 2px">
<div style="font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: 0.16em; color: #6B6B72; padding: 0 10px 6px">{{g.title}}</div>
<sc-for list="{{g.items}}" as="i" hint-placeholder-count="4">
<a href="{{i.href}}" aria-current="{{i.current}}" style="height: 48px; padding: 0 10px; border-radius: 12px; background: {{i.bg}}; color: {{i.fg}}; text-decoration: none; display: flex; align-items: center; gap: 12px; font-size: 16px; font-weight: {{i.weight}}; box-shadow: {{i.shadow}}">
<svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="{{i.icon}}"></path></svg>
<span style="flex-grow: 1">{{i.label}}</span>
<sc-if value="{{i.hasBadge}}" hint-placeholder-val="{{ false }}"><span style="min-width: 22px; height: 20px; padding: 0 6px; box-sizing: border-box; border-radius: 999px; background: {{i.badgeBg}}; color: {{i.badgeFg}}; font-family: 'JetBrains Mono', monospace; font-size: 11px; display: flex; align-items: center; justify-content: center">{{i.badge}}</span></sc-if>
</a>
</sc-for>
</div>
</sc-for>
<div style="margin-top: auto; display: flex; align-items: center; gap: 10px; padding: 12px 8px; border-top: 1px solid #E6E4DE">
<span style="width: 34px; height: 34px; border-radius: 50%; background: #E3E1F9; color: #3B3FD9; font-size: 12px; font-weight: 500; display: flex; align-items: center; justify-content: center">AD</span>
<span style="flex-grow: 1; display: flex; flex-direction: column"><span style="font-size: 14px; font-weight: 500">[NOME DO ADMIN]</span><span style="font-size: 12px; color: #6B6B72">Administrador</span></span>
<a href="MobileAdminLogin.dc.html" style="height: 40px; padding: 0 12px; border-radius: 10px; border: 1px solid #E6E4DE; display: flex; align-items: center; color: #44444A; text-decoration: none; font-size: 13px">Sair</a>
</div>
</nav>
</sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"active":{"editor":"enum","options":["dashboard","pedidos","produtos","categorias","estoque","clientes","pagamentos","auditoria","falhas"],"default":"dashboard"},"title":{"editor":"text","default":"Dashboard"},"$preview":{"width":390,"height":60}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { menu: false }; }
  renderVals() {
    const a = this.props.active || 'dashboard';
    const I = {
      dash: 'M4 13h6V4H4zM14 20h6v-9h-6zM14 4h6v4h-6zM4 20h6v-3H4z',
      ord: 'M5 8h14l-1 12H6L5 8ZM9 8V6a3 3 0 0 1 6 0v2',
      prod: 'M12 3 3 8l9 5 9-5-9-5ZM3 8v8l9 5 9-5V8',
      cat: 'M4 6h7v7H4zM13 6h7v7h-7zM4 15h7v5H4zM13 15h7v5h-7z',
      stock: 'M3 7h18v13H3zM3 7l3-4h12l3 4M9 12h6',
      cust: 'M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8ZM2 21c1-4 4-6 7-6s6 2 7 6M17 11a3 3 0 1 0 0-6M19 15c2 1 3 3 3 6',
      pay: 'M2 6h20v12H2zM2 10h20',
      audit: 'M9 5h10v16H5V9zM9 5v4H5M9 14h6M9 17h4',
      fail: 'M12 3 2 21h20L12 3ZM12 10v5M12 18h.01'
    };
    const mk = (id, label, icon, href, badge, tone) => {
      const on = id === a;
      return {
        label, icon, href: href || '#', current: on ? 'page' : 'false',
        bg: on ? '#FFFFFF' : 'transparent', fg: on ? '#3B3FD9' : (href ? '#18181B' : '#6B6B72'), weight: on ? 500 : 400,
        shadow: on ? '0 1px 2px rgba(24,24,27,.06)' : 'none',
        hasBadge: !!badge, badge: badge || '',
        badgeBg: tone === 'goal' ? '#FCEEE4' : tone === 'bad' ? '#FCEEE4' : '#ECECFD',
        badgeFg: tone === 'goal' || tone === 'bad' ? '#B4501E' : '#3B3FD9'
      };
    };
    return {
      menu: this.state.menu, openMenu: () => this.setState({ menu: true }), closeMenu: () => this.setState({ menu: false }), title: this.props.title || 'Dashboard',
      h: (Number(this.props.h) || 960) + 'px',
      groups: [
        { title: 'OPERAÇÃO', items: [
          mk('dashboard', 'Dashboard', I.dash, 'MobileAdminDashboard.dc.html'),
          mk('pedidos', 'Pedidos', I.ord, 'MobileAdminPedidos.dc.html', '8'),
          mk('produtos', 'Produtos', I.prod, 'MobileAdminProdutos.dc.html'),
          mk('categorias', 'Categorias', I.cat, 'MobileAdminCategorias.dc.html'),
          mk('estoque', 'Estoque', I.stock, 'MobileAdminEstoque.dc.html', '3', 'goal')
        ] },
        { title: 'CLIENTES E FINANÇAS', items: [
          mk('clientes', 'Clientes', I.cust, 'MobileAdminClientes.dc.html'),
          mk('pagamentos', 'Pagamentos', I.pay, 'MobileAdminPagamentos.dc.html')
        ] },
        { title: 'SISTEMA', items: [
          mk('auditoria', 'Auditoria', I.audit, 'MobileAdminAuditoria.dc.html'),
          mk('falhas', 'Mensagens com falha', I.fail, 'MobileAdminFalhas.dc.html', '2', 'bad')
        ] }
      ]
    };
  }
}
</script>
</body>
</html>
