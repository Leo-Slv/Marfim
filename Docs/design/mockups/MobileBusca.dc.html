<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Mobile · Busca</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:Outfit,system-ui,sans-serif;background:#F4F3EF;color:#18181B}
a{color:#3B3FD9}
button{font-family:inherit;cursor:pointer}button:disabled{cursor:not-allowed;opacity:.55}
input,textarea,select{font-family:Outfit,sans-serif}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible,a:focus-visible,summary:focus-visible{outline:2px solid #3B3FD9;outline-offset:2px}
input[type=radio],input[type=checkbox]{accent-color:#3B3FD9;width:18px;height:18px;margin:0;flex-shrink:0}
@keyframes up{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes sheet{from{transform:translateY(100%)}to{transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pop{0%{transform:scale(.7);opacity:0}60%{transform:scale(1.08);opacity:1}100%{transform:scale(1)}}
@keyframes bump{0%{transform:scale(1)}40%{transform:scale(1.25)}100%{transform:scale(1)}}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(21,128,61,.45)}100%{box-shadow:0 0 0 8px rgba(21,128,61,0)}}
@keyframes shake{0%,100%{transform:none}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes draw{from{stroke-dashoffset:60}to{stroke-dashoffset:0}}
@keyframes shimmer{from{background-position:-400px 0}to{background-position:400px 0}}
@keyframes toast{0%{opacity:0;transform:translateY(16px)}10%{opacity:1;transform:none}90%{opacity:1;transform:none}100%{opacity:0;transform:translateY(8px)}}
@keyframes grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes growx{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.up{animation:up .5s cubic-bezier(.2,.7,.2,1) both}
.d1{animation-delay:.06s}.d2{animation-delay:.12s}.d3{animation-delay:.18s}
.sheet{animation:sheet .4s cubic-bezier(.2,.7,.2,1) both}
.fade{animation:fade .3s ease both}
.spin{animation:spin .9s linear infinite}
.slow{animation:spin 40s linear infinite}
.pop{animation:pop .45s cubic-bezier(.2,.7,.2,1) both}
.bump{animation:bump .4s ease}
.pulse{animation:pulse 1.8s ease-out infinite}
.shake{animation:shake .35s ease}
.floaty{animation:floaty 5s ease-in-out infinite}
.check path{stroke-dasharray:60;animation:draw .6s ease .25s both}
.skel{background:linear-gradient(90deg,#F1F0EC 0,#E9E8E3 50%,#F1F0EC 100%);background-size:800px 100%;animation:shimmer 1.4s linear infinite}
.toast{animation:toast 2.8s ease both}
.grow{transform-origin:top;animation:grow .7s cubic-bezier(.2,.7,.2,1) both .2s}
.growx{transform-origin:left;animation:growx .8s cubic-bezier(.2,.7,.2,1) both}
.chips{scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
details summary{list-style:none;cursor:pointer}details summary::-webkit-details-marker{display:none}
details[open] .chev{transform:rotate(180deg)}.chev{transition:transform .25s;display:inline-block}
@media (prefers-reduced-motion:reduce){*{animation:none !important;transition:none !important}}
</style>
</helmet>
<div style="width: 390px; height: 1200px; background: #F4F3EF; display: flex; flex-direction: column; overflow: hidden; position: relative">
<div style="height: 30px; background: #3B3FD9; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: 0.08em">TROCA FÁCIL EM 30 DIAS</div>
<header style="padding: 10px 8px 10px 4px; display: flex; align-items: center; gap: 4px; border-bottom: 1px solid #E6E4DE">
<a href="MobileInicio.dc.html" aria-label="Voltar" style="width: 44px; height: 44px; border-radius: 12px; display: flex; align-items: center; justify-content: center; color: #18181B"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M15 6l-6 6 6 6"></path></svg></a>
<label style="flex-grow: 1; height: 46px; display: flex; align-items: center; gap: 8px; padding: 0 12px; background: #FFFFFF; border: 1px solid #3B3FD9; border-radius: 12px">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#6B6B72" stroke-width="1.6" stroke-linecap="round"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>
<input type="search" aria-label="Buscar produtos" placeholder="Peça, ateliê ou categoria" value="{{term}}" onChange="{{onTerm}}" style="flex-grow: 1; min-width: 0; border: none; outline: none; background: transparent; font-size: 16px; color: #18181B">
<sc-if value="{{hasTerm}}" hint-placeholder-val="{{ true }}"><button onClick="{{clear}}" aria-label="Limpar" style="width: 32px; height: 32px; border: none; background: #F1F0EC; border-radius: 50%; font-size: 14px; color: #44444A">×</button></sc-if>
</label>
</header>

<!-- Antes de digitar -->
<sc-if value="{{idle}}" hint-placeholder-val="{{ false }}">
<section class="fade" style="padding: 20px 16px; display: flex; flex-direction: column; gap: 22px">
<div style="display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; justify-content: space-between; align-items: baseline"><span style="font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: 0.16em; color: #6B6B72">BUSCAS RECENTES</span><button onClick="{{clearRecent}}" style="border: none; background: none; color: #3B3FD9; font-size: 13px; font-weight: 500; min-height: 32px">Limpar</button></div>
<sc-for list="{{recent}}" as="r" hint-placeholder-count="3"><button onClick="{{r.go}}" style="min-height: 44px; border: none; border-bottom: 1px solid #E6E4DE; background: transparent; display: flex; align-items: center; gap: 12px; font-size: 16px; color: #18181B; text-align: left"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#6B6B72" stroke-width="1.6" stroke-linecap="round"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 2"></path></svg>{{r.label}}</button></sc-for>
<sc-if value="{{noRecent}}" hint-placeholder-val="{{ false }}"><span style="font-size: 14px; color: #6B6B72">Nenhuma busca recente.</span></sc-if>
</div>
<div style="display: flex; flex-direction: column; gap: 10px">
<span style="font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: 0.16em; color: #6B6B72">MAIS PROCURADOS</span>
<div style="display: flex; flex-wrap: wrap; gap: 8px">
<sc-for list="{{popular}}" as="p" hint-placeholder-count="5"><button onClick="{{p.go}}" style="height: 40px; padding: 0 14px; border-radius: 999px; border: none; background: #F1F0EC; color: #44444A; font-size: 14px; font-weight: 500">{{p.label}}</button></sc-for>
</div>
</div>
</section>
</sc-if>

<!-- Termo curto -->
<sc-if value="{{short}}" hint-placeholder-val="{{ false }}">
<section class="fade" style="padding: 48px 24px; text-align: center; display: flex; flex-direction: column; gap: 6px"><span style="font-size: 22px; font-weight: 300">Continue digitando</span><span style="font-size: 14px; color: #6B6B72">A busca começa a partir de 2 letras.</span></section>
</sc-if>

<!-- Sem resultado -->
<sc-if value="{{none}}" hint-placeholder-val="{{ false }}">
<section class="up" style="padding: 40px 20px; display: flex; flex-direction: column; align-items: center; gap: 10px; text-align: center">
<div class="floaty" style="width: 60px; height: 60px; border-radius: 50%; background: #F1F0EC; display: flex; align-items: center; justify-content: center"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#6B6B72" stroke-width="1.5" stroke-linecap="round"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5M8 11h6"></path></svg></div>
<span style="font-size: 22px; font-weight: 300">Nada para “{{termShown}}”</span>
<span style="font-size: 14px; color: #6B6B72; line-height: 1.5">Confira a grafia ou tente o tipo da peça ou o nome do ateliê.</span>
<div style="display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; padding-top: 6px"><sc-for list="{{popular}}" as="p" hint-placeholder-count="4"><button onClick="{{p.go}}" style="height: 40px; padding: 0 14px; border-radius: 999px; border: none; background: #F1F0EC; color: #44444A; font-size: 14px">{{p.label}}</button></sc-for></div>
</section>
</sc-if>

<!-- Resultados -->
<sc-if value="{{hasResults}}" hint-placeholder-val="{{ true }}">
<section style="padding: 16px; display: flex; flex-direction: column; gap: 12px">
<span style="font-size: 14px; color: #44444A">{{resultLabel}}</span>
<sc-for list="{{results}}" as="r" hint-placeholder-count="3">
<a key="{{r.key}}" class="up" href="MobileProduto.dc.html" style="display: flex; gap: 12px; align-items: center; padding: 8px; background: #FFFFFF; border: 1px solid #E6E4DE; border-radius: 14px; text-decoration: none; color: #18181B">
<span style="width: 72px; height: 72px; border-radius: 10px; background: {{r.tint}}; display: flex; align-items: center; justify-content: center; flex-shrink: 0"><dc-import name="Art" kind="{{r.kind}}" size="42" hint-size="42px,47px"></dc-import></span>
<span style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 12px; color: #6B6B72">{{r.brand}} · {{r.cat}}</span><span style="font-size: 15px; font-weight: 500">{{r.name}}</span><span style="font-family: 'JetBrains Mono', monospace; font-size: 13px">{{r.price}}</span></span>
<span style="color: #6B6B72; padding-right: 6px">›</span>
</a>
</sc-for>
</section>
</sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1200}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { term: 'lumin', recent: ['vaso', 'manta', 'Oficina Faísca'] }; }
  norm(s) { return s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, ''); }
  renderVals() {
    const s = this.state;
    const P = [['Luminária Arco', 'Iluminação', 489, 'lamp', '#ECECFD', 'Oficina Faísca'], ['Pendente Orbe', 'Iluminação', 359, 'pendant', '#F1F0EC', 'Oficina Faísca'], ['Arandela Fio', 'Iluminação', 279, 'sconce', '#FCEEE4', 'Oficina Faísca'], ['Vaso Duna', 'Casa', 129, 'vase', '#F1F0EC', 'Barro Cru'], ['Cadeira Lina', 'Casa', 1290, 'chair', '#E8F5EC', 'Oficina Tora'], ['Par de canecas Grão', 'Cozinha', 89, 'mug', '#FCEEE4', 'Barro Cru'], ['Jarra Seixo', 'Cozinha', 149, 'jar', '#E8F5EC', 'Barro Cru'], ['Manta Trama', 'Têxteis', 219, 'throw', '#ECECFD', 'Tear Alto'], ['Almofada Linho', 'Têxteis', 119, 'throw', '#FCEEE4', 'Tear Alto']];
    const t = this.norm(s.term.trim());
    const res = t.length >= 2 ? P.filter((p) => this.norm(p[0] + ' ' + p[1] + ' ' + p[5]).includes(t)) : [];
    const setTerm = (v) => this.setState({ term: v, recent: v && !s.recent.includes(v) ? [v].concat(s.recent).slice(0, 5) : s.recent });
    return {
      term: s.term, hasTerm: s.term.length > 0, termShown: s.term.trim(),
      onTerm: (e) => this.setState({ term: e.target.value }), clear: () => this.setState({ term: '' }),
      idle: t.length === 0, short: t.length === 1, none: t.length >= 2 && res.length === 0, hasResults: res.length > 0,
      recent: s.recent.map((r) => ({ label: r, go: () => setTerm(r) })), noRecent: s.recent.length === 0, clearRecent: () => this.setState({ recent: [] }),
      popular: ['Luminária', 'Cerâmica', 'Manta', 'Cadeira', 'Tear Alto'].map((p) => ({ label: p, go: () => setTerm(p) })),
      resultLabel: res.length + (res.length === 1 ? ' resultado para “' : ' resultados para “') + s.term.trim() + '”',
      results: res.map((p) => ({ key: t + p[0], name: p[0], cat: p[1], price: 'R$ ' + p[2].toLocaleString('pt-BR'), kind: p[3], tint: p[4], brand: p[5] }))
    };
  }
}
</script>
</body>
</html>
