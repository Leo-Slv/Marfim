<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Cabeçalho da loja</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div style="width: 100%; font-family: Outfit, system-ui, sans-serif; color: #18181B; background: #F4F3EF">
<div style="height: 36px; background: #3B3FD9; color: #FFFFFF; display: flex; align-items: center; justify-content: center; gap: 28px; font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.08em; white-space: nowrap; overflow: hidden">
<span>TROCA FÁCIL EM 30 DIAS</span><span>·</span><span>PEÇAS FEITAS À MÃO POR QUATRO ATELIÊS</span><span>·</span><span>COLEÇÃO OUTONO 2026</span>
</div>
<header style="border-bottom: 1px solid #E6E4DE">
<div style="max-width: 1280px; margin: 0 auto; padding: 0 40px; box-sizing: border-box; height: 72px; display: flex; align-items: center; gap: 40px">
<a href="Main.dc.html" style="display: flex; align-items: center; gap: 8px; text-decoration: none; color: #18181B">
<span style="width: 28px; height: 28px; border-radius: 8px; background: #3B3FD9; display: flex; align-items: center; justify-content: center">
<svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round"><circle cx="8" cy="8" r="5"></circle><path d="M8 3v10"></path></svg>
</span>
<span style="font-size: 20px; font-weight: 500; letter-spacing: -0.02em">marfim<span style="color: #3B3FD9">.</span></span>
</a>
<nav class="nav" aria-label="Categorias" style="display: flex; gap: 28px; font-size: 14px">
<sc-for list="{{navItems}}" as="n" hint-placeholder-count="5">
<a class="nav-a" href="Listagem.dc.html" style="text-decoration: none; color: {{n.color}}; font-weight: {{n.weight}}">{{n.label}}</a>
</sc-for>
</nav>
<div style="flex-grow: 1"></div>
<a class="hide-md" href="Listagem.dc.html" style="display: flex; align-items: center; gap: 8px; height: 40px; width: 240px; box-sizing: border-box; padding: 0 14px; background: #FFFFFF; border: 1px solid #E6E4DE; border-radius: 12px; color: #6B6B72; text-decoration: none; font-size: 14px">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>Buscar produtos</a>
<div style="display: flex; gap: 6px">
<a class="icon-b" href="{{accountHref}}" aria-label="{{accountLabel}}" style="height: 44px; min-width: 44px; padding: 0 10px; box-sizing: border-box; border-radius: 12px; color: #18181B; text-decoration: none; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 14px">
<svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="12" cy="8" r="4"></circle><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"></path></svg>
<span class="hide-md">{{accountText}}</span>
</a>
<a class="icon-b" href="Carrinho.dc.html" aria-label="Sacola, {{count}} itens" style="height: 44px; box-sizing: border-box; padding: 0 12px 0 10px; border-radius: 12px; border: 1px solid {{bagBorder}}; background: {{bagBg}}; color: {{bagFg}}; text-decoration: none; display: flex; align-items: center; gap: 8px; font-size: 14px">
<svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><path d="M5 8h14l-1 12H6L5 8Z"></path><path d="M9 8V6a3 3 0 0 1 6 0v2"></path></svg>
<span>Sacola</span>
<span key="{{count}}" class="pop" style="min-width: 20px; height: 20px; padding: 0 6px; box-sizing: border-box; border-radius: 999px; background: {{badgeBg}}; color: {{badgeFg}}; font-family: 'JetBrains Mono', monospace; font-size: 11px; display: flex; align-items: center; justify-content: center">{{countText}}</span>
</a>
</div>
</div>
</header>
<sc-if value="{{showConfirm}}" hint-placeholder-val="{{ false }}">
<div role="status" style="background: #FCEEE4; border-bottom: 1px solid #F3D9C6">
<div style="max-width: 1280px; margin: 0 auto; padding: 10px 40px; box-sizing: border-box; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; font-size: 14px; color: #18181B">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#B4501E" stroke-width="1.6" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"></rect><path d="m3 7 9 6 9-6"></path></svg>
<span style="flex-grow: 1">Confirme seu e-mail para poder finalizar compras. Enviamos o link para <b style="font-weight: 500">{{email}}</b>.</span>
<sc-if value="{{resent}}" hint-placeholder-val="{{ false }}">
<span style="font-size: 13px; color: #15803D">Link reenviado. Confira também o spam.</span>
</sc-if>
<sc-if value="{{notResent}}" hint-placeholder-val="{{ true }}">
<button onClick="{{resend}}" style="height: 36px; padding: 0 14px; border-radius: 10px; border: 1px solid #B4501E; background: transparent; color: #B4501E; font-size: 13px; font-weight: 500">Reenviar link</button>
</sc-if>
</div>
</div>
</sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"count":{"editor":"int","default":3,"min":0,"max":99},"active":{"editor":"enum","options":["","novidades","casa","cozinha","iluminacao","texteis","sacola"],"default":""},"logged":{"editor":"boolean","default":false},"showConfirm":{"editor":"boolean","default":false},"email":{"editor":null,"default":"voce@email.com"},"$preview":{"width":1440,"height":108}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { resent: false }; }
  renderVals() {
    const p = this.props;
    const count = Number(p.count ?? 3);
    const active = p.active || '';
    const cats = [['novidades', 'Novidades'], ['casa', 'Casa'], ['cozinha', 'Cozinha'], ['iluminacao', 'Iluminação'], ['texteis', 'Têxteis']];
    const onBag = active === 'sacola';
    return {
      navItems: cats.map(([id, label]) => ({ label, color: id === active ? '#3B3FD9' : '#18181B', weight: id === active ? 500 : 400 })),
      count, countText: count > 9 ? '9+' : String(count),
      badgeBg: count > 0 ? '#E8793A' : '#F1F0EC', badgeFg: count > 0 ? '#FFFFFF' : '#6B6B72',
      bagBorder: onBag ? '#3B3FD9' : '#E6E4DE', bagBg: onBag ? '#ECECFD' : '#FFFFFF', bagFg: onBag ? '#3B3FD9' : '#18181B',
      accountHref: p.logged ? 'Conta.dc.html' : 'Acesso.dc.html',
      accountLabel: p.logged ? 'Minha conta' : 'Entrar',
      accountText: p.logged ? 'Minha conta' : 'Entrar',
      showConfirm: !!p.showConfirm, email: p.email || 'voce@email.com',
      resent: this.state.resent, notResent: !this.state.resent,
      resend: () => this.setState({ resent: true })
    };
  }
}
</script>
</body>
</html>
